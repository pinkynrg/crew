name: Publish to npm

# Runs only when the SHIPPED package changes — the code under bin/** or the package
# manifest/lock. Pushes that touch just docs, the website, tests, or *.md (README, CLAUDE.md,
# …) do NOT cut a release, so unrelated commits don't bump the npm version. Want to publish a
# docs-only change anyway? Trigger this workflow manually (workflow_dispatch, in the Actions tab).
#
# ONE test execution, strictly ordered:  test (under coverage) → badge from THAT number → publish.
# The suite runs exactly once, instrumented (c8 changes timing, never behavior) — its pass/fail IS
# the release gate, and its percentage feeds the badge. No second regime: if a case can't survive
# instrumentation timing, the case is flaky and should be fixed, not re-run uninstrumented.
# Version handling is automatic:
#   - if package.json's version is NOT yet on npm -> publish it as-is (tag it);
#   - if it IS already on npm -> auto-bump the patch version, commit + tag, publish.
# Commits pushed by CI (coverage badge, version bump) are marked [skip ci] so they don't
# retrigger this workflow. Auth is npm Trusted Publishing (OIDC) — no NPM_TOKEN secret;
# the package's Trusted Publisher on npmjs.com must point at this repo + publish.yml, and
# the publish job needs `id-token: write` plus npm >= 11.5.1 (installed below).
on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.cov.outputs.pct }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Syntax check
        run: node --check bin/crew.js && node --check bin/graph.js
      - name: Install expect (the E2E + TUI suites drive crew in a real PTY)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq expect
      - name: Test with coverage (snapshots + E2E + TUI goldens — the one and only suite run)
        id: cov
        run: |
          set -o pipefail   # without this, `| tee` would swallow a failing suite and green-light the gate
          npm run -s test:cov | tee cov.txt
          PCT=$(grep -m1 'All files' cov.txt | awk -F'|' '{gsub(/ /,"",$2); print $2}')
          echo "pct=${PCT%.*}" >> "$GITHUB_OUTPUT"

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the coverage-badge + auto-bump commits + tag
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1; npm 11 supports node 20)
        run: npm install -g npm@11
      - name: Refresh coverage badge (from the test job's number — no re-run)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PCT='${{ needs.test.outputs.coverage }}'
          [ -n "$PCT" ] || { echo "no coverage number from the test job"; exit 1; }
          if   [ "$PCT" -ge 90 ]; then C=brightgreen
          elif [ "$PCT" -ge 80 ]; then C=green
          elif [ "$PCT" -ge 70 ]; then C=yellowgreen
          elif [ "$PCT" -ge 60 ]; then C=yellow
          elif [ "$PCT" -ge 50 ]; then C=orange
          else C=red; fi
          sed -i -E "s#coverage-[0-9]+%25-[a-z]+#coverage-${PCT}%25-${C}#" README.md
          if git diff --quiet README.md; then
            echo "coverage badge unchanged (${PCT}%)"
          else
            git add README.md
            git commit -m "ci: coverage badge ${PCT}% [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Resolve version (publish as-is, or auto-bump patch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on npm — bumping patch."
            npm version patch -m "ci: release v%s [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" --follow-tags
          else
            echo "$NAME@$VERSION not on npm — publishing as-is."
            git tag "v$VERSION" || true
            git push origin "v$VERSION" || true
          fi
      - name: Publish
        run: npm publish --provenance --access public
